<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #222;
    }

    /* ── Sidebar ─────────────────────────────── */
    #sidebar {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: 1px solid #ddd;
      z-index: 1;
    }

    #sidebar-header {
      padding: 12px 12px 10px;
      border-bottom: 1px solid #eee;
    }

    #sidebar-header h1 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .layer-item {
      display: flex;
      align-items: center;
      padding: 5px 12px;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .layer-item:hover { background: #f5f7fa; }

    .layer-item input[type="checkbox"] {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: #4a90d9;
    }

    /* ── Zone legend ─────────────────────────── */
    #zone-legend {
      padding: 10px 12px;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    #zone-legend h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #666;
      margin-bottom: 6px;
    }

    .legend-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
    }

    .legend-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .legend-swatch {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .legend-label {
      font-size: 10px;
      color: #555;
    }

    .layer-label {
      font-style: italic;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .layer-item.loading .layer-label { color: #999; }

    /* ── Group headers ───────────────────────── */
    .group-header {
      padding: 6px 12px 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      background: #f8f8f8;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    #ref-list { border-bottom: 1px solid #eee; }

    .ref-swatch {
      width: 24px;
      height: 4px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* search sits inside the species group header */
    #search-wrap {
      padding: 6px 12px 8px;
      border-bottom: 1px solid #eee;
    }

    #search {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }

    #search:focus { border-color: #4a90d9; }

    #layer-list {
      overflow-y: auto;
      flex: 1;
    }

    #sidebar-footer {
      padding: 8px 12px;
      font-size: 11px;
      color: #888;
      border-top: 1px solid #eee;
    }

    /* ── Basemap selector ────────────────────── */
    #basemap-section {
      padding: 8px 12px;
      border-top: 1px solid #eee;
    }

    #basemap-section h2 {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      margin-bottom: 6px;
    }

    #basemap-select {
      width: 100%;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      background: #fff;
      cursor: pointer;
      outline: none;
    }

    #basemap-select:focus { border-color: #4a90d9; }

    /* ── Maps (two synced panels) ────────────── */
    #content { display: flex; flex: 1; min-height: 0; }

    #maps { display: flex; flex: 1; min-height: 0; }

    .map-panel {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .map-panel + .map-panel { border-left: 2px solid #ddd; }

    .map-canvas {
      position: absolute;
      inset: 0;
    }

    .panel-label {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
      background: rgba(255,255,255,0.9);
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      pointer-events: none;
    }

    nav.site-nav {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 8px 16px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
      font-size: 13px;
    }
    nav.site-nav .site-title {
      font-weight: 600;
      color: #222;
      margin-right: auto;
      text-decoration: none;
    }
    nav.site-nav .site-title:hover { text-decoration: underline; }
    nav.site-nav a {
      text-decoration: none;
      color: #4a90d9;
      font-weight: 500;
    }
    nav.site-nav a:hover { text-decoration: underline; }
    nav.site-nav .nav-disabled {
      color: #999;
      cursor: default;
      pointer-events: none;
    }

    /* ── Popup ───────────────────────────────── */
    .maplibregl-popup-content {
      font-size: 12px;
      padding: 8px 12px;
      min-width: 120px;
    }

    .popup-species { font-style: italic; font-weight: 600; margin-bottom: 4px; }
    .popup-zone { color: #555; }
  </style>
</head>

<div id="content">
<div id="sidebar">
  <div id="sidebar-header">
    <h1>Seed Zones</h1>
  </div>
  <div id="zone-legend">
    <h2>Zone ID</h2>
    <div class="legend-grid" id="legend-grid"></div>
  </div>

  <div class="group-header">Reference</div>
  <div id="ref-list"></div>

  <div class="group-header">Species</div>
  <div id="search-wrap">
    <input id="search" type="text" placeholder="Filter species…" autocomplete="off">
  </div>
  <div id="layer-list"></div>

  <div id="basemap-section">
    <h2>Basemap</h2>
    <select id="basemap-select">
      <option value="liberty">Liberty</option>
      <option value="bright">Bright</option>
      <option value="positron">Positron</option>
    </select>
  </div>
  <div id="sidebar-footer">0 layers active</div>
</div>

<!-- Two synced panels: forecast (left) and current (right) -->
<div id="maps">
  <div class="map-panel">
    <div class="panel-label">Forecast</div>
    <div id="map-forecast" class="map-canvas"></div>
  </div>
  <div class="map-panel">
    <div class="panel-label">Current</div>
    <div id="map-current" class="map-canvas"></div>
  </div>
</div>
</div><!-- #content -->

<script>
  // ── Panel config ──────────────────────────────────────────────
  // One sidebar drives BOTH maps. Each panel fetches a species layer
  // from its own directory, so the same toggle shows forecast data on
  // the left and current data on the right.
  //
  //   ► If your two panels share one dataset, set both `dir` to 'data'.
  //   ► Per-panel species file is built as: `${dir}/${species}.geojson`
  //     (edit speciesUrl() below if your paths differ).
  const PANELS = [
    { id: 'forecast', container: 'map-forecast', dir: '../data_future' }, // LEFT
    { id: 'current',  container: 'map-current',  dir: '../data'        }, // RIGHT
  ];

  function speciesUrl(panel, sp) {
    return `${panel.dir}/${sp}.geojson`;
  }

  // 12-color qualitative palette for zone IDs (ColorBrewer Set3)
  const ZONE_COLORS = [
    '#8dd3c7','#ffffb3','#bebada','#fb8072','#80b1d3','#fdb462',
    '#b3de69','#fccde5','#d9d9d9','#bc80bd','#ccebc5','#ffed6f'
  ];

  // MapLibre match expression: colors polygon by integer ID 1–12
  const ID_COLOR_EXPR = [
    'match', ['get', 'ID'],
    1,  ZONE_COLORS[0],
    2,  ZONE_COLORS[1],
    3,  ZONE_COLORS[2],
    4,  ZONE_COLORS[3],
    5,  ZONE_COLORS[4],
    6,  ZONE_COLORS[5],
    7,  ZONE_COLORS[6],
    8,  ZONE_COLORS[7],
    9,  ZONE_COLORS[8],
    10, ZONE_COLORS[9],
    11, ZONE_COLORS[10],
    12, ZONE_COLORS[11],
    '#cccccc'  // fallback for any ID outside 1–12
  ];

  // ── Highlight-on-click config ─────────────────────────────────
  // Clicking a polygon highlights the borders of EVERY feature in that
  // layer that shares the same value of a grouping field — applied to
  // both panels, so the group lights up in current AND forecast.
  // Species group on `ID`; reference layers group on their popup field.
  const SPECIES_GROUP_FIELD = 'ID';                 // change to your grouping column
  const HL_CASING = { color: '#ffffff', width: 5,   opacity: 0.9 }; // white halo under
  const HL_LINE   = { color: '#111111', width: 2.5, opacity: 1.0 }; // dark line on top
  // Fill tint for the group: flashes in at startOpacity, eases DOWN to
  // endOpacity over fadeMs. Set endOpacity:0 for a flash that fully fades.
  const HL_FILL   = { color: '#ffd400', startOpacity: 0.55, endOpacity: 0.12, fadeMs: 650 };

  // ── Map init (one per panel) ──────────────────────────────────
  PANELS.forEach(panel => {
    panel.map = new maplibregl.Map({
      container: panel.container,
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [-87.6, 41.9],
      zoom: 4
    });
    // Each map gets its own popup (a popup is bound to a single map).
    panel.popup = new maplibregl.Popup({ closeButton: false, closeOnClick: true });
    setupInteraction(panel);
  });

  // Controls only on the right (current) map — both pan/zoom together.
  const rightMap = PANELS[PANELS.length - 1].map;
  rightMap.addControl(new maplibregl.NavigationControl(), 'top-right');
  rightMap.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');

  // ── Keep the panels in sync (MapLibre equivalent of Leaflet.Sync) ──
  syncMaps(PANELS.map(p => p.map));

  function syncMaps(maps) {
    const handlers = maps.map((m, i) => () => sync(i));
    const on  = () => maps.forEach((m, i) => m.on('move',  handlers[i]));
    const off = () => maps.forEach((m, i) => m.off('move', handlers[i]));

    function sync(masterIndex) {
      off(); // prevent feedback loops while we mirror the view
      const master = maps[masterIndex];
      const view = {
        center:  master.getCenter(),
        zoom:    master.getZoom(),
        bearing: master.getBearing(),
        pitch:   master.getPitch()
      };
      maps.forEach((m, i) => { if (i !== masterIndex) m.jumpTo(view); });
      on();
    }
    on();
  }

  // ── State ─────────────────────────────────────────────────────
  // active: key -> { kind:'species'|'ref', color?, ref?, groupField }
  const active = new Map();
  // The single group currently highlighted: { key, field, value } | null
  let currentHighlight = null;
  // cache: avoids refetching on basemap swap. Species cached per panel,
  // references cached once (shared across panels).
  const cache = new Map();

  async function getData(cacheKey, url) {
    if (cache.has(cacheKey)) return cache.get(cacheKey);
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.statusText);
    const json = await res.json();
    cache.set(cacheKey, json);
    return json;
  }

  // ── Zone legend (component #2) ────────────────────────────────
  function buildLegend() {
    const grid = document.getElementById('legend-grid');
    ZONE_COLORS.forEach((color, i) => {
      const cell = document.createElement('div');
      cell.className = 'legend-cell';

      const sw = document.createElement('div');
      sw.className = 'legend-swatch';
      sw.style.background = color;

      const lbl = document.createElement('span');
      lbl.className = 'legend-label';
      lbl.textContent = i + 1;

      cell.appendChild(sw);
      cell.appendChild(lbl);
      grid.appendChild(cell);
    });
  }

  // ── Species sidebar (the ~60-entry toggle list) ───────────────
  function buildSidebar(species) {
    const list = document.getElementById('layer-list');

    species.forEach(sp => {
      const item = document.createElement('div');
      item.className = 'layer-item';
      item.dataset.sp = sp;

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = `cb-${sp}`;

      const lbl = document.createElement('label');
      lbl.className = 'layer-label';
      lbl.htmlFor = `cb-${sp}`;
      lbl.title = sp.replace(/_/g, ' ');
      lbl.textContent = sp.replace(/_/g, ' ');

      cb.addEventListener('change', () => toggleSpecies(sp, cb, item));

      item.appendChild(cb);
      item.appendChild(lbl);
      list.appendChild(item);
    });
  }

  // ── Toggle a species on/off across BOTH panels ────────────────
  async function toggleSpecies(sp, cb, item) {
    if (cb.checked) {
      item.classList.add('loading');
      try {
        await addSpecies(sp);
      } catch (err) {
        console.warn(`Failed to load ${sp}:`, err);
        removeKey(sp);          // roll back any partial add
        cb.checked = false;
      }
      item.classList.remove('loading');
    } else {
      removeKey(sp);
    }
    updateFooter();
  }

  async function addSpecies(sp) {
    if (active.has(sp)) return;
    // Fetch every panel first; if one fails we throw and roll back.
    const datas = [];
    for (const panel of PANELS) {
      datas.push(await getData(`${panel.id}::${sp}`, speciesUrl(panel, sp)));
    }
    PANELS.forEach((panel, i) => paintSpecies(panel, sp, datas[i]));
    active.set(sp, { kind: 'species', groupField: SPECIES_GROUP_FIELD });
  }

  function paintSpecies(panel, sp, geojson) {
    const m = panel.map;
    m.addSource(sp, { type: 'geojson', data: geojson });
    m.addLayer({
      id: `${sp}-fill`, type: 'fill', source: sp,
      paint: { 'fill-color': ID_COLOR_EXPR, 'fill-opacity': 0.45 }
    });
    m.addLayer({
      id: `${sp}-outline`, type: 'line', source: sp,
      paint: { 'line-color': ID_COLOR_EXPR, 'line-width': 1.2, 'line-opacity': 0.9 }
    });
    addHighlightLayers(m, sp, SPECIES_GROUP_FIELD);
  }

  // ── Remove a key (species or ref) from both panels ────────────
  function removeKey(key) {
    PANELS.forEach(panel => {
      const m = panel.map;
      ['-hl', '-hl-casing', '-hl-fill', '-fill', '-outline'].forEach(suffix => {
        if (m.getLayer(`${key}${suffix}`)) m.removeLayer(`${key}${suffix}`);
      });
      if (m.getSource(key)) m.removeSource(key);
    });
    if (currentHighlight && currentHighlight.key === key) currentHighlight = null;
    active.delete(key);
  }

  // ── Group highlight (borders of every record sharing the value) ──
  function addHighlightLayers(m, key, field) {
    const none = ['==', ['get', field], '___none___']; // matches nothing initially
    m.addLayer({
      id: `${key}-hl-fill`, type: 'fill', source: key, filter: none,
      paint: { 'fill-color': HL_FILL.color, 'fill-opacity': 0 }
    });
    m.addLayer({
      id: `${key}-hl-casing`, type: 'line', source: key, filter: none,
      paint: {
        'line-color': HL_CASING.color, 'line-width': HL_CASING.width,
        'line-opacity': HL_CASING.opacity, 'line-blur': 0.3,
        'line-join': 'round', 'line-cap': 'round'
      }
    });
    m.addLayer({
      id: `${key}-hl`, type: 'line', source: key, filter: none,
      paint: {
        'line-color': HL_LINE.color, 'line-width': HL_LINE.width,
        'line-opacity': HL_LINE.opacity, 'line-join': 'round', 'line-cap': 'round'
      }
    });
  }

  // Animate the tint's alpha from startOpacity down to endOpacity (ease-out).
  let hlAnim = null;
  function animateTint(key) {
    if (hlAnim) cancelAnimationFrame(hlAnim);
    const { startOpacity: a0, endOpacity: a1, fadeMs: dur } = HL_FILL;
    const t0 = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - t, 2);          // ease-out
      const op = a0 + (a1 - a0) * eased;
      PANELS.forEach(panel => {
        const m = panel.map;
        if (m.getLayer(`${key}-hl-fill`)) m.setPaintProperty(`${key}-hl-fill`, 'fill-opacity', op);
      });
      hlAnim = t < 1 ? requestAnimationFrame(frame) : null;
    }
    hlAnim = requestAnimationFrame(frame);
  }

  function applyHighlight(key, field, value) {
    if (field == null || value == null) return;
    currentHighlight = { key, field, value };
    const filt = ['==', ['get', field], value];
    PANELS.forEach(panel => {
      const m = panel.map;
      if (!m.getLayer(`${key}-hl`)) return;
      m.setFilter(`${key}-hl-fill`, filt);
      m.setFilter(`${key}-hl-casing`, filt);
      m.setFilter(`${key}-hl`, filt);
      m.moveLayer(`${key}-hl-fill`);   // keep the whole highlight above other layers
      m.moveLayer(`${key}-hl-casing`); // (borders end up on top of the tint)
      m.moveLayer(`${key}-hl`);
    });
    animateTint(key);
  }

  function clearHighlight() {
    if (hlAnim) { cancelAnimationFrame(hlAnim); hlAnim = null; }
    if (!currentHighlight) return;
    const { key, field } = currentHighlight;
    const none = ['==', ['get', field], '___none___'];
    PANELS.forEach(panel => {
      const m = panel.map;
      if (m.getLayer(`${key}-hl`)) {
        m.setFilter(`${key}-hl-fill`, none);
        m.setFilter(`${key}-hl-casing`, none);
        m.setFilter(`${key}-hl`, none);
      }
    });
    currentHighlight = null;
  }

  // ── Reference layers (component #3) ───────────────────────────
  // References are shared context (boundaries etc.) shown on both panels.
  const REFERENCES = [
    { id: 'CookCounty',        label: 'Cook County',         file: '../data/CookCounty.geojson',        color: '#555555', popup: { title: 'Cook County',        field: 'SeedZone',   fieldLabel: 'Seed Zone' } },
    { id: 'PSTZs',             label: 'PSTZs',               file: '../data/PSTZs.geojson',             color: '#b45309', popup: { title: 'PSTZ',               field: 'New_label',  fieldLabel: 'Zone'      } },
    { id: 'EasternSeedZones',  label: 'Eastern Seed Zones',  file: '../data/EasternSeedZones.geojson',  color: '#065f46', popup: { title: 'Eastern Seed Zones',  field: 'SeedZone',   fieldLabel: 'Seed Zone' } },
  ];

  const REF_COLORS = ['#555555','#b45309','#065f46'];

  function buildRefSidebar(refs) {
    const list = document.getElementById('ref-list');
    if (refs.length === 0) { list.style.display = 'none'; return; }

    refs.forEach((ref, i) => {
      const color = ref.color ?? REF_COLORS[i % REF_COLORS.length];

      const item = document.createElement('div');
      item.className = 'layer-item';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = `cb-ref-${ref.id}`;

      const swatch = document.createElement('div');
      swatch.className = 'ref-swatch';
      swatch.style.background = color;

      const lbl = document.createElement('label');
      lbl.className = 'layer-label';
      lbl.htmlFor = `cb-ref-${ref.id}`;
      lbl.textContent = ref.label;

      cb.addEventListener('change', () => toggleRef(ref, color, cb, item));

      item.appendChild(cb);
      item.appendChild(swatch);
      item.appendChild(lbl);
      list.appendChild(item);
    });
  }

  async function toggleRef(ref, color, cb, item) {
    if (cb.checked) {
      item.classList.add('loading');
      try {
        await addRef(ref, color);
      } catch (err) {
        console.warn(`Failed to load reference layer ${ref.id}:`, err);
        removeKey(ref.id);
        cb.checked = false;
      }
      item.classList.remove('loading');
    } else {
      removeKey(ref.id);
    }
    updateFooter();
  }

  async function addRef(ref, color) {
    if (active.has(ref.id)) return;
    const data = await getData(`shared::${ref.id}`, ref.file); // one fetch, both panels
    PANELS.forEach(panel => paintRef(panel, ref, color, data));
    active.set(ref.id, { kind: 'ref', color, ref, groupField: ref.popup ? ref.popup.field : null });
  }

  function paintRef(panel, ref, color, geojson) {
    const m = panel.map;
    m.addSource(ref.id, { type: 'geojson', data: geojson });
    m.addLayer({
      id: `${ref.id}-outline`, type: 'line', source: ref.id,
      paint: { 'line-color': color, 'line-width': 1.5, 'line-dasharray': [3, 2] }
    });
    if (ref.popup) {
      // Transparent fill stays click-queryable for popups.
      m.addLayer({
        id: `${ref.id}-fill`, type: 'fill', source: ref.id,
        paint: { 'fill-color': color, 'fill-opacity': 0 }
      });
      addHighlightLayers(m, ref.id, ref.popup.field);
    }
  }

  // ── Click / hover popups (delegated, per map) ─────────────────
  function setupInteraction(panel) {
    const m = panel.map;

    const activeFillIds = () => {
      const ids = [];
      active.forEach((entry, key) => {
        if (m.getLayer(`${key}-fill`)) ids.push(`${key}-fill`);
      });
      return ids;
    };

    m.on('click', e => {
      const ids = activeFillIds();
      const feats = ids.length ? m.queryRenderedFeatures(e.point, { layers: ids }) : [];
      if (!feats.length) { clearHighlight(); return; }  // empty click clears the group

      const f = feats[0];
      const key = f.layer.id.replace(/-fill$/, '');
      const entry = active.get(key);
      let html;
      if (entry && entry.kind === 'ref') {
        const val = f.properties[entry.ref.popup.field] ?? '—';
        html = `<div class="popup-species">${entry.ref.popup.title}</div>
                <div class="popup-zone">${entry.ref.popup.fieldLabel}: ${val}</div>`;
      } else {
        const zoneId = f.properties.ID ?? '—';
        html = `<div class="popup-species">${key.replace(/_/g, ' ')}</div>
                <div class="popup-zone">Zone ID: ${zoneId}</div>`;
      }
      panel.popup.setLngLat(e.lngLat).setHTML(html).addTo(m);

      // Highlight every record in this layer sharing the clicked group value.
      clearHighlight();
      if (entry && entry.groupField) {
        applyHighlight(key, entry.groupField, f.properties[entry.groupField]);
      }
    });

    m.on('mousemove', e => {
      const ids = activeFillIds();
      const hit = ids.length && m.queryRenderedFeatures(e.point, { layers: ids }).length;
      m.getCanvas().style.cursor = hit ? 'pointer' : '';
    });
  }

  // ── Footer count ──────────────────────────────────────────────
  function updateFooter() {
    const n = active.size;
    document.getElementById('sidebar-footer').textContent =
      `${n} layer${n !== 1 ? 's' : ''} active`;
  }

  // ── Basemap switcher (applies to both panels) ─────────────────
  document.getElementById('basemap-select').addEventListener('change', e => {
    const style = e.target.value;
    PANELS.forEach(panel => {
      panel.map.setStyle(`https://tiles.openfreemap.org/styles/${style}`);
      // Re-add active layers from cache once the new style is ready.
      panel.map.once('styledata', () => repaintPanel(panel));
    });
  });

  function repaintPanel(panel) {
    active.forEach((entry, key) => {
      if (entry.kind === 'ref') {
        const data = cache.get(`shared::${key}`);
        if (data) paintRef(panel, entry.ref, entry.color, data);
      } else {
        const data = cache.get(`${panel.id}::${key}`);
        if (data) paintSpecies(panel, key, data);
      }
    });
    // Restore the active group highlight on the rebuilt style.
    if (currentHighlight) {
      const { key, field, value } = currentHighlight;
      const m = panel.map;
      if (m.getLayer(`${key}-hl`)) {
        const filt = ['==', ['get', field], value];
        m.setFilter(`${key}-hl-fill`, filt);
        m.setFilter(`${key}-hl-casing`, filt);
        m.setFilter(`${key}-hl`, filt);
        m.setPaintProperty(`${key}-hl-fill`, 'fill-opacity', HL_FILL.endOpacity);
        m.moveLayer(`${key}-hl-fill`);
        m.moveLayer(`${key}-hl-casing`);
        m.moveLayer(`${key}-hl`);
      }
    }
  }

  // ── Search filter (species only) ──────────────────────────────
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('#layer-list .layer-item').forEach(el => {
      const name = el.dataset.sp.toLowerCase().replace(/_/g, ' ');
      el.style.display = name.includes(q) ? '' : 'none';
    });
  });

  // ── Species list (inlined to avoid file:// fetch restrictions) ─
  const SPECIES = ["Carex_tuckermanii","Hypoxis_hirsuta","Lithospermum_canescens","Ruellia_humilis","Asclepias_exaltata","Asclepias_purpurascens","Astragalus_crassicarpus","Blephilia_ciliata","Blephilia_hirsuta","Brachyelytrum_erectum","Bromus_kalmii","Bromus_nottowayanus","Carex_cristatella","Carex_davisii","Carex_festucacea","Carex_gracillima","Carex_hirtifolia","Carex_lupuliformis","Carex_meadii","Carex_pensylvanica","Carex_projecta","Carex_sartwellii","Carex_siccata","Carex_stricta","Carex_vesicaria","Carex_woodii","Castilleja_coccinea","Castilleja_sessiliflora","Cinna_arundinacea","Cirsium_altissimum","Dichanthelium_leibergii","Elymus_hystrix","Gentiana_andrewsii","Heuchera_richardsonii","Krigia_biflora","Lilium_philadelphicum","Lithospermum_latifolium","Luzula_multiflora","Micranthes_pensylvanica","Nabalus_racemosus","Pediomelum_esculentum","Pulsatilla_patens","Sisyrinchium_campestre","Sporobolus_michauxianus","Stachys_hispida","Viola_pedatifida"]
;

  // ── Boot (wait for both maps to load) ─────────────────────────
  Promise.all(PANELS.map(p => new Promise(res => p.map.on('load', res))))
    .then(() => {
      buildLegend();
      buildRefSidebar(REFERENCES);
      buildSidebar(SPECIES);
    });
</script>
</body>
</html>
